<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Desafio 1 - Cartão de Perfil</title>
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .profile-card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 300px;
        }

        .profile-card img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
        }

        .profile-card h1 {
            font-size: 22px;
            color: #333333;
            margin-bottom: 10px;
        }

        .profile-card p {
            color: #666666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .profile-card a {
            display: inline-block;
            margin: 0 5px;
            padding: 8px 15px;
            background-color: #007bff;
            color: #ffffff;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
        }

        .profile-card a:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <div class="profile-card">
        <img src="Atividades/photos/sam.jpg" alt="Foto de Perfil">
        <h1>Samphoto</h1>
        <p>Estudante de Sistemas de Informação apaixonado por Fotografia,Astronomia,aviões e tecnologia.</p>
        <a href="https://github.com" target="_blank">GitHub</a>
        <a href="https://wa.me/5565999935581" target="_blank">WhatsApp</a>
    </div>

</body>

</html>
