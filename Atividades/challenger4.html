<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 4 - Galeria de Fotos</title>
    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 40px;
        }

        .gallery-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-item {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            width: 260px;
        }

        .gallery-item img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }

        .gallery-item p {
            padding: 15px;
            margin: 0;
            text-align: center;
            color: #475569;
            font-size: 0.95rem;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <h1>Minhas Paixões</h1>
    <div class="gallery-container">
        <div class="gallery-item">
            <img src="https://preview.redd.it/the-boeing-777-200lr-rolled-out-on-this-day-in-2005-v0-10mevwxvraje1.jpeg?auto=webp&s=9faf1211d2dbea93b20addbeb80aad2a112625d4"
                alt="TOP 1">
            <p>Boeing 777
            </p>
        </div>
        <div class="gallery-item">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTFJJaWx5PdrZnyl6aS5J5lB2seSA9TLbAY-P5tLL_nomjt1b6tinslbOg&s=10"
                alt="TOP2">
            <p>Airbus A350
            </p>
        </div>
        <div class="gallery-item">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQmMiljFRn65t5mtQzX7wevzpl2pS4OfDWMLJ2d1r487iYYZKJJ4EfEwoQU&s=10"
                alt="TOP3">
            <p>Boeing 747</p>
        </div>
        <div class="gallery-item">
            <img src="https://cdn.autopapo.com.br/box/uploads/2026/07/23103612/boeing-737-max-da-gol-foto-etn-reproducao.jpeg"
                alt="TOP4">
            <p>Boeing 737</p>
        </div>
    </div>
</body>

</html>
